<section class="register">

    <h2>Student Registration</h2>

    <p>Create your StudentHub account.</p>

    <form id="registerForm" action="backend/register.php" method="POST">

        <label>Full Name</label><br>
        <input type="text" name="fullName" placeholder="Enter your full name" required><br><br>

        <label>Email</label><br>
        <input type="email" name="email" placeholder="Enter your email" required><br><br>

        <label>Password</label><br>
        <label>Confirm Password</label><br>
        <input type="password" name="confirmPassword" placeholder="Re‑enter your password" required><br><br>

        <label>Department</label><br>

        <select>

            <option>Computer Engineering</option>
            <option>Information Technology</option>
            <option>Mechanical Engineering</option>
            <option>Civil Engineering</option>
            <option>Electrical Engineering</option>

        </select>

        <br><br>

        <input type="submit" value="Register">

        <input type="reset" value="Clear">

    </form>

    <br>

    <p>Already have an account?</p>

    <a href="login.html">
        <button type="button">Login</button>
    </a>

</section>
